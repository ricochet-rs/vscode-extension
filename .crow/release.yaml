# Push a `v<version>` tag on main to release.
# The tag's version is written into package.json and the CHANGELOG's Unreleased heading,
# committed to main as ricochet-bot, and the tag is moved onto that commit before anything is published.
# A tag on a commit that is not on main, or pushed after main moved on, fails before publishing.
# The GitHub release notes come from git-sv, while CHANGELOG.md is the hand-written page the stores show.
clone:
  git:
    image: codefloe.com/crow-plugins/clone:1.2.2
    settings:
      tags: true

when:
  - event: tag
    ref: refs/tags/v*

labels:
  agent: thumper

steps:
  bump:
    image: reg.ricochet.rs/docker.io/library/alpine:3.24
    commands:
      - apk add --no-cache -q git sed
      - |
        set -euxo pipefail
        VERSION="${CI_COMMIT_TAG#v}"
        # Both stores accept only major.minor.patch.
        echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag $CI_COMMIT_TAG is not v<major>.<minor>.<patch>" >&2; exit 1; }

        sed -i "0,/\"version\": \"[^\"]*\"/s//\"version\": \"$VERSION\"/" package.json
        sed -i "s/^## Unreleased$/## $VERSION/" CHANGELOG.md
        grep -q "^## $VERSION$" CHANGELOG.md || { echo "CHANGELOG.md has no Unreleased or $VERSION section" >&2; exit 1; }

        git config user.name "ricochet-bot"
        git config user.email "droid@ricochet.rs"
        git add package.json CHANGELOG.md
        if git diff --cached --quiet; then
          echo "==> Files already at $VERSION; no bump commit needed"
        else
          git commit -m "chore(release): $VERSION"
          git tag -d "$CI_COMMIT_TAG"
          git tag "$CI_COMMIT_TAG" HEAD
        fi

  changelog:
    image: reg.ricochet.rs/docker.io/thegeeklab/git-sv:3.0.6
    depends_on:
      - bump
    commands:
      - apk add --no-cache -q sed
      - git sv current-version
      - git sv release-notes -t ${CI_COMMIT_TAG} -o release-notes.md
      # Drop the version heading, which the release title already carries.
      - sed -i '1,2d' release-notes.md
      - cat release-notes.md

  package:
    image: reg.ricochet.rs/docker.io/oven/bun:1.4
    depends_on:
      - bump
    commands:
      - bun install --frozen-lockfile
      - bun run package

  "Push bump and tag":
    image: reg.ricochet.rs/docker.io/library/alpine:3.24
    depends_on:
      - package
    environment:
      SSH_KEY:
        from_secret: ricochet-bot-ssh-key
    commands:
      - apk add --no-cache -q git openssh-client
      - |
        set -euo pipefail
        mkdir -p ~/.ssh
        # Written untraced so the key never reaches the log.
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
        set -x

        # The workspace was written by `bun install`, so ignore any hooks or ssh command it planted.
        git() { command git -c core.hooksPath=/dev/null -c core.sshCommand=ssh "$@"; }
        git config user.name "ricochet-bot"
        git config user.email "droid@ricochet.rs"
        git remote add origin-push git@github.com:ricochet-rs/vscode-extension.git
        git fetch origin-push main

        git merge-base --is-ancestor "$CI_COMMIT_SHA" origin-push/main || { echo "$CI_COMMIT_TAG is not on main, so nothing is released" >&2; exit 1; }

        if ! git log -1 --format=%s | grep -q '^chore(release): '; then
          echo "==> No bump commit to push"
          exit 0
        fi

        # A plain push only fast-forwards, so main moving since the tag fails here instead of publishing a tree main never had.
        git push origin-push HEAD:main || { echo "main moved since $CI_COMMIT_TAG was pushed. Delete the tag and tag the new main." >&2; exit 1; }
        git push origin-push --force "$CI_COMMIT_TAG"

  "Create release":
    image: reg.ricochet.rs/docker.io/woodpeckerci/plugin-release:1.0.0
    depends_on:
      - changelog
      - "Push bump and tag"
    settings:
      title: ${CI_COMMIT_TAG}
      note: release-notes.md
      overwrite: true
      api_key:
        from_secret: ricochet_issue_token
      files:
        - "*.vsix"

  "Publish to Open VSX":
    image: reg.ricochet.rs/docker.io/oven/bun:1.4
    depends_on:
      - "Push bump and tag"
    environment:
      OVSX_PAT:
        from_secret:
          integration: 1
          path: open-vsx/tokens/ricochet-rs
          key: token
    commands:
      - bunx ovsx publish ricochet-${CI_COMMIT_TAG#v}.vsix --skip-duplicate

  "Publish to VS Code Marketplace":
    image: reg.ricochet.rs/docker.io/oven/bun:1.4
    depends_on:
      - "Push bump and tag"
    environment:
      VSCE_PAT:
        from_secret:
          integration: 1
          path: vscode-marketplace/tokens/ricochet-rs
          key: token
    commands:
      - bunx vsce publish --packagePath ricochet-${CI_COMMIT_TAG#v}.vsix --skip-duplicate
