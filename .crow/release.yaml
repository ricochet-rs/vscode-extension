# Publishing is manual for now: Open VSX is the marketplace Positron reads, and it
# needs a namespace token that is not yet provisioned. Until then this pipeline only
# builds and attaches the VSIX to the tag.
when:
  - event: tag
    ref: refs/tags/v*

labels:
  agent: thumper

cache:
  - key: 'bun-v1-{{ arch }}-{{ checksum "bun.lock" }}'
    restore_keys: ["bun-v1-{{ arch }}-"]
    paths: [.cache/bun]
    save: never

steps:
  package:
    image: reg.ricochet.rs/docker.io/oven/bun:1.4
    environment:
      BUN_INSTALL_CACHE_DIR: ${CI_WORKSPACE}/.cache/bun
    commands:
      - bun install --frozen-lockfile
      - bun run build
      - bun run package
